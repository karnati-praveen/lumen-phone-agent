[package]
name = "aegis_broker"
version = "3.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Aegis deterministic Rust Security Broker, Hard-Rule Policy Engine, Capability Token Minter, Prompt-Injection Sanitizer & Hash-Chained Audit Log"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "aegis_broker"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
zeroize = { version = "1.7", features = ["derive"] }
uuid = { version = "1.10", features = ["v4"] }
chacha20poly1305 = "0.10"
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1.0"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
